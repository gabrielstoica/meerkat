<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Meerkat">
  <title>Meerkat</title>
  <style>
    .copper { fill: #b86a2b; }
    .ink-80 { fill: #101820; fill-opacity: 0.8; }
    .ink-45 { fill: #101820; fill-opacity: 0.45; }
    @media (prefers-color-scheme: dark) {
      .copper { fill: #d4894a; }
      .ink-80 { fill: #eef1f4; fill-opacity: 0.8; }
      .ink-45 { fill: #eef1f4; fill-opacity: 0.45; }
    }
  </style>
  <!-- Three-dot lookout mark from BrandMark: copper, ink/80 (offset), ink/45 -->
  <circle class="copper" cx="13.5" cy="6.5" r="4" />
  <circle class="ink-80" cx="18.5" cy="16" r="4" />
  <circle class="ink-45" cx="13.5" cy="25.5" r="4" />
</svg>
